name: Build oscaroff

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --platform linux/amd64 -t pongo-oscaroff-builder .

      - name: Build oscaroff module
        run: |
          mkdir -p out
          docker run --rm \
            --platform linux/amd64 \
            -v "$PWD/out:/out" \
            pongo-oscaroff-builder

      - name: Upload oscaroff artifact
        uses: actions/upload-artifact@v4
        with:
          name: oscaroff
          path: out/oscaroff
          if-no-files-found: error